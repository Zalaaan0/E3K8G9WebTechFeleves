<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Nevezés</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div id="head">
        <h1>Csapatnevezési Űrlap</h1>
    </div>

    <nav>
        <a href="index.html">Főoldal</a>
        <a href="tabella.html">Tabella</a>
        <a href="nevezes.html">Csapatnevezés</a>
        <a href="szabalyok.html">Szabályzat</a>
    </nav>
    <div class="main">
        <h2>Nevezd be csapatodat!</h2>
        <p>Minden mező kitöltése kötelező a sikeres regisztrációhoz.</p>
        <form id="registration-form" novalidate>
            <div class="form-group">
                <label for="team-name">Csapat neve:</label>
                <input type="text" id="team-name" name="team-name" placeholder="Pl. Vasgyári Sasok">
                <span class="error-message" id="error-team-name"></span>
            </div>
            <div class="form-group">
                <label for="captain">Csapatkapitány neve:</label>
                <input type="text" id="captain" name="captain" placeholder="Teljes név">
                <span class="error-message" id="error-captain"></span>
            </div>
            <div class="form-group">
                <label for="founded">Csapat alapításának dátuma:</label>
                <input type="date" id="founded" name="founded">
                <span class="error-message" id="error-founded"></span>
            </div>
            <div class="form-group">
                <label for="jersey-color">Elsődleges mezszín kiválasztása:</label>
                <input type="color" id="jersey-color" name="jersey-color" value="#2e7d32">
            </div>
            <div class="form-group">
                <label>Melyik játéknapot preferáljátok?</label>
                <label class="inline-label"><input type="radio" name="day" value="saturday"> Szombat délelőtt</label>
                <label class="inline-label"><input type="radio" name="day" value="sunday"> Vasárnap délután</label>
                <span class="error-message" id="error-day"></span>
            </div>
            <div class="form-group">
                <label for="players">Játékoskeret (minimum 6 név felsorolása):</label>
                <textarea id="players" name="players" rows="4" placeholder="Írd ide a játékosok nevét..."></textarea>
                <span class="error-message" id="error-players"></span>
            </div>
            <div class="form-group">
                <label class="inline-label">
                    <input type="checkbox" id="accept-rules" name="rules">
                    Elolvastam és elfogadom a <a href="szabalyok.html">versenyszabályzatot</a>.
                </label>
                <span class="error-message" id="error-rules"></span>
            </div>
            <div class="form-group">
                <button type="submit">Nevezés elküldése</button>
                <button type="reset" id="btn-reset" style="background-color: #666;">Mezők törlése</button>
            </div>
        </form>
        <div id="registration-success"></div>
    </div>
    <div id="foot">
        <p>&copy; 2026 Városi Labdarúgó Szövetség</p>
    </div>
</body>
</html>
